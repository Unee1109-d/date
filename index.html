<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Will You Go On A Date With Me? 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #ffeef5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 90%;
      max-width: 500px;
      min-height: 430px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(180, 70, 110, 0.2);
      position: relative;
    }

    .heart {
      font-size: 70px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }

    h1 {
      color: #d6336c;
      font-size: 32px;
      margin: 15px 0;
    }

    p {
      color: #777;
      font-size: 18px;
    }

    .buttons {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      gap: 25px;
      position: relative;
      height: 70px;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #yes {
      background: #ff4f87;
      color: white;
      box-shadow: 0 6px 15px rgba(255, 79, 135, 0.3);
    }

    #yes:hover {
      transform: scale(1.1);
    }

    #no {
      background: #eee;
      color: #555;
      position: absolute;
      left: 55%;
    }

    #message {
      display: none;
      margin-top: 30px;
    }

    #message h2 {
      color: #ff4081;
      font-size: 35px;
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 25px;
      animation: floatUp 4s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">💗</div>

    <h1>Will you go on a date with me?</h1>

    <p>I have a very important question for you... 🥺</p>

    <div class="buttons">
      <button id="yes">YES 💕</button>
      <button id="no">NO 😭</button>
    </div>

    <div id="message">
      <h2>YAYYYY! 💕🥰</h2>
      <p>I knew you'd say yes! ❤️</p>
      <div style="font-size: 60px;">🌹💐💗✨</div>
    </div>

  </div>

  <script>

    const noButton = document.getElementById("no");
    const yesButton = document.getElementById("yes");
    const buttonsArea = document.querySelector(".buttons");
    const message = document.getElementById("message");

    // NO товч cursor ойртоход зугтана
    noButton.addEventListener("mouseenter", moveButton);

    // Утас дээр дарах гэж оролдоход бас зугтана
    noButton.addEventListener("touchstart", function(e) {
      e.preventDefault();
      moveButton();
    });

    function moveButton() {

      const area = buttonsArea.getBoundingClientRect();

      const maxX = area.width - noButton.offsetWidth;
      const maxY = area.height - noButton.offsetHeight;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noButton.style.left = randomX + "px";
      noButton.style.top = randomY + "px";
    }

    // YES дарахад
    yesButton.addEventListener("click", function() {

      buttonsArea.style.display = "none";
      message.style.display = "block";

      // Зүрхнүүд гаргах
      for (let i = 0; i < 30; i++) {
        createHeart();
      }
    });

    function createHeart() {

      const heart = document.createElement("div");

      heart.className = "floating-heart";
      heart.innerHTML = ["❤️", "💗", "💕", "💖", "💘"][Math.floor(Math.random() * 5)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (2 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

  </script>

</body>
</html>
